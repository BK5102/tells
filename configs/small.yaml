# Small-subset experiment on the 300-card TabFormer sample: CPU, minutes.
# Same split as configs/tabformer.yaml.
name: small
dataset: tabformer
data: data/interim/tabformer_small_n300_seed0.parquet

split:
  min_gap_days: 90
  train: {start: null, end: 2015-10-01}
  valid: {start: 2016-01-01, end: 2017-01-01}
  test: {start: 2017-04-01, end: 2020-01-01}

contestants: [lazy_amount, lgbm_checklist]
budgets: [0.005, 0.01, 0.02, 0.05]
