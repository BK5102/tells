[project]
name = "tells"
version = "0.0.1"
description = "Do pretrained time series models help catch fraud at a fixed review budget? An honest, agent-run evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "cleanroom",
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
    "polars>=1.30",
    "pyyaml>=6.0",
]

[project.scripts]
tells = "tells.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tells"]

[tool.uv.workspace]
members = ["packages/cleanroom"]

[tool.uv.sources]
cleanroom = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/cleanroom/tests"]
addopts = "--import-mode=importlib -ra"
markers = [
    "data: needs raw data under data/raw (skipped when the files are missing)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # one-off CLI scripts with long usage lines
